[project]
name = "dhi-mleo"
version = "0.1.0"
description = "dhi-mleo: Python library designed to integrate in-situ measurements and Earth Observation data with machine learning workflows"
readme = "README.md"
authors = [
    { name = "Walid Ghariani"},
    { name = "Elena Merola"}
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.3",
    "tqdm>=4.67.1",
    "rioxarray>=0.19.0",
    "xarray>=2025.9.0",
    "scikit-learn>=1.6.1",
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
ml_extra = [
    "xgboost>=3.0.1",
    "lightgbm>=4.6.0", 
]

geo = [
    "geopandas>=1.1.1",
    "folium>=0.12",
]

viz = [
    "plotly>=6.3.0",
    "mapclassify",
]

dev = [
    "build",
    "pytest",
    "ruff",
    "black",
    "mypy",
    "mkdocs",
    "mkdocstrings[python]", 
    "mkdocs-material",
    "ipykernel>=6.29.5",
    "jupyterlab>=4.4.2",
]

notebooks = [
    "jupyter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I"]  
lint.ignore = ["E501"]        
extend-exclude = ["notebooks"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true
strict_optional = true
